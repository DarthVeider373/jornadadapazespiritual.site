const BONUS_ITEMS=[{id:'angels',ic:'shield-check',name:'Código dos 3 Arcanjos',desc:'Três práticas de coragem, cuidado e direção.'},{id:'diary',ic:'calendar-days',name:'Diário de 21 Dias',desc:'21 princípios de Provérbios com registro pessoal.'},{id:'hours',ic:'clock-4',name:'Mapa das Horas de Poder',desc:'Três horários simbólicos de recolhimento.'},{id:'stones',ic:'gem',name:'Amuleto das 7 Pedras',desc:'Cristais como símbolos de intenção e constância.'},{id:'custom',ic:'scroll-text',name:'Ritual Personalizado',desc:'Uma declaração feita para o seu momento de vida.'}];
function openBonus(id){tab='bonus';activeBonus=id;window.scrollTo({top:0,behavior:'smooth'});render()}
function bonusPage(){if(activeBonus)return `<button onclick="activeBonus=null;render()" class="flex gap-2 items-center text-xs text-[#F0D98E] mb-5">${icon('arrow-left','w-4 h-4')} Voltar a todos os bônus</button>`+({angels:angelsPage,diary:diaryPage,hours:hoursPage,stones:stonesPage,custom:customPage}[activeBonus]||(()=>''))();return `${title('A coleção exclusiva','Bônus Sagrados','Cinco experiências interativas para transformar a leitura em reflexão, atitude e compromisso diário.')}<div class="space-y-3">${BONUS_ITEMS.map((b,i)=>`<button onclick="openBonus('${b.id}')" class="glass w-full rounded-2xl p-4 text-left flex items-center gap-4"><div class="w-14 h-14 rounded-xl bg-[#D4AF37]/10 border border-[#D4AF37]/20 flex items-center justify-center text-[#E9CF86]">${icon(b.ic,'w-7 h-7')}</div><div class="flex-1"><div class="smallcaps text-[#A99A76] mb-1">Bônus 0${i+1}</div><h2 class="serif text-[15px] text-[#F0E0AC]">${b.name}</h2><p class="text-[11px] muted mt-1 leading-5">${b.desc}</p></div>${icon('chevron-right','w-5 h-5 text-[#D4AF37]')}</button>`).join('')}</div>`}
function angelsPage(){const a=ANGELS[selectedAngel],done=state.shieldDates[a.id]===today();return `${title('Bônus primeiro','Código dos 3 Arcanjos','Na tradição judaico-cristã, os arcanjos são figuras de fé. Os selos abaixo representam práticas pessoais de oração e não garantem proteção ou resultados sobrenaturais.')}
 <div class="grid grid-cols-3 gap-2 mb-5">${ANGELS.map((v,i)=>`<button onclick="selectedAngel=${i};render()" class="rounded-2xl p-3 border text-center ${selectedAngel===i?'border-[#D4AF37] bg-[#D4AF37]/15':'border-[#D4AF37]/20 bg-[#181824]'}"><div class="mx-auto w-12 h-12 rounded-full border border-[#D4AF37]/40 flex items-center justify-center mb-2 text-[#F3D88C]">${icon(v.icon)}</div><div class="serif text-[12px]">${v.name}</div>${state.shieldDates[v.id]===today()?'<div class="text-green-300 text-[9px] mt-1">Ativado hoje</div>':''}</button>`).join('')}</div>
 ${card(`<div class="smallcaps text-[#D4AF37]">Selo de ${a.name}</div><h2 class="serif text-xl text-[#F2DB96] mt-2">${a.subtitle}</h2><p class="text-xs muted leading-6 mt-3">${a.text}</p><div class="text-[10px] text-[#CBB675] mt-2">Referência: ${a.verse}</div><div class="mt-5">${a.ritual.map((s,i)=>`<div class="flex gap-3 mb-4"><div class="w-7 h-7 rounded-full bg-[#D4AF37]/15 text-[#F3DE9A] text-xs font-bold flex items-center justify-center shrink-0">${i+1}</div><p class="text-xs leading-6 muted">${s}</p></div>`).join('')}</div><div class="rounded-xl bg-[#D4AF37]/10 p-3 text-xs text-[#E9D498]">Palavra associada: #${a.word} · ${WORDS[a.word-1].name}</div><button class="gold-button w-full rounded-xl py-3 mt-4" onclick="activateShield('${a.id}')">${icon(done?'check-circle-2':'shield','w-4 h-4 inline mr-2')} ${done?'Escudo registrado hoje':'Ativar Escudo Hoje'}</button>`)}
 <p class="text-[10px] muted leading-5 mt-4 text-center">“Ativar” registra uma intenção espiritual pessoal; não é uma afirmação de proteção física ou intervenção comprovada.</p>`}
function activateShield(id){if(state.shieldDates[id]===today()){notify('A sua intenção de hoje já foi registrada.');return}state.shieldDates[id]=today();state.xp+=20;save();notify('Selo simbólico registrado! +20 XP');render()}
function currentUnlockedDay(){return Math.min(21,dayCount()+1)}
function diaryPage(){const unlocked=currentUnlockedDay(),d=DAYS[selectedDay-1],locked=selectedDay>unlocked,done=selectedDay<=dayCount();return `${title('Bônus segundo','Diário de Salomão','21 dias, 21 princípios, 21 pequenos compromissos. O próximo dia se desbloqueia após um ritual concluído em uma nova data.')}
 ${card(`<div class="flex justify-between text-xs text-[#F1D68A] mb-3"><b>${dayCount()} de 21 dias</b><span>${Math.round(dayCount()/21*100)}%</span></div><div class="progress-track"><div class="progress-fill" style="width:${dayCount()/21*100}%"></div></div><div class="grid grid-cols-7 gap-2 mt-5">${DAYS.map((v,i)=>{let n=i+1,lk=n>unlocked;return `<button onclick="chooseDay(${n})" class="day-cell ${n===selectedDay?'active':''} ${n<=dayCount()?'done':''} ${lk?'locked':''}" title="Dia ${n}${lk?' bloqueado':''}" aria-label="Dia ${n}${lk?' bloqueado':''}">${lk?icon('lock','w-3 h-3'):n<=dayCount()?icon('check','w-3 h-3'):icon('sun','w-3 h-3')}<span class="text-[11px] font-bold">${n}</span></button>`}).join('')}</div>`, 'mb-4')}
 ${locked?card(`<div class="text-center py-8">${icon('lock-keyhole','w-10 h-10 text-[#D4AF37] mx-auto')}<h3 class="serif text-lg mt-3">Dia ${selectedDay} ainda está selado</h3><p class="text-xs muted leading-6 mt-2">Continue sua jornada: cada dia concluído libera uma nova reflexão. Seu próximo dia disponível é o ${unlocked}.</p><button class="gold-button rounded-xl py-3 px-6 mt-5" onclick="chooseDay(${unlocked})">Abrir dia disponível</button></div>`):card(`<div class="smallcaps text-[#D4AF37]">Dia ${selectedDay} ${done?'· Percorrido':'· Disponível'}</div><h2 class="serif text-[19px] text-[#F2DC9B] mt-2">${d.principle}</h2><div class="text-[11px] text-[#CCB578] mt-2">${d.verse} · referência temática</div><div class="border-t border-[#D4AF37]/20 my-4"></div><div class="smallcaps text-[#D4AF37]">Reflexão</div><p class="text-xs leading-6 muted mt-2">${d.reflection}</p><div class="rounded-xl bg-[#D4AF37]/10 p-3 mt-4"><div class="smallcaps text-[#E3C575]">Passo prático</div><p class="text-xs leading-6 mt-2">${d.action}</p></div><label for="dayEntry" class="block text-xs font-bold text-[#F0DDAB] mt-5 mb-2">Minha intenção ou gratidão</label><textarea id="dayEntry" class="field min-h-[115px]" maxlength="1500" placeholder="O que quero cultivar ou agradecer neste dia?">${escapeHTML(state.diary[selectedDay]||'')}</textarea><button onclick="saveDayEntry()" class="gold-button w-full rounded-xl py-3 mt-3">${icon('save','w-4 h-4 inline-block mr-1')} Salvar reflexão</button>`, 'mb-4')}
 <p class="text-[11px] muted leading-5">Os textos são reflexões originais inspiradas em Provérbios, não transcrições literais dos versículos.</p>`}
function chooseDay(n){selectedDay=n;render()}
function saveDayEntry(){if(selectedDay>currentUnlockedDay()){notify('Este dia ainda não está disponível.');return}state.diary[selectedDay]=document.getElementById('dayEntry').value.trim();save();notify('Sua reflexão foi guardada neste dispositivo. +0 XP')}
function hoursPage(){return `${title('Bônus terceiro','Mapa das Horas de Poder','Esses horários são sugestões simbólicas de pausa, não momentos comprovadamente mais eficazes para orações. Adapte-os à sua rotina e ao seu sono.')}
 ${card(`<div class="text-center py-4"><div class="smallcaps text-[#E7C66C]" id="powerStatus">${isPowerHour()?'HORA DE PODER ATIVA':'PORTAL COMUM'}</div><div id="liveClock" class="serif text-5xl gold-text mt-5 tabular-nums">${new Date().toLocaleTimeString('pt-BR')}</div><p class="text-xs muted mt-3">Horário local do seu dispositivo</p><div class="border-t border-[#D4AF37]/20 mt-5 pt-5"><div class="text-xs muted">Próxima pausa sugerida</div><div class="serif text-lg text-[#E8CE84] mt-2">${nextHour().name}</div><div id="bonusCountdown" class="text-3xl font-bold tracking-wider mt-3 tabular-nums">${countdown()}</div></div></div>`, 'mb-5')}
 <div class="space-y-3">${HOURS.map(h=>card(`<div class="flex gap-3 items-center"><div class="w-16 h-16 rounded-full border border-[#D4AF37]/35 flex items-center justify-center serif text-xl text-[#F1D88B]">${String(h.hour).padStart(2,'0')}:00</div><div class="flex-1"><h3 class="serif text-[15px] text-[#F0D996]">${h.name}</h3><div class="text-[11px] muted mt-1">Palavra ${h.word} · ${WORDS[h.word-1].name}</div></div></div><p class="text-xs italic leading-6 muted mt-3">“${h.prayer}”</p>`)).join('')}</div><p class="mt-4 text-[11px] muted">A faixa “ativa” corresponde aos primeiros 30 minutos de cada horário indicado. Não é necessário acordar de madrugada.</p>`}
function stonesPage(){const s=STONES[selectedStone];return `${title('Bônus quarto','Amuleto das Sete Pedras','Um catálogo simbólico para lembrar suas intenções. Pedras naturais não possuem poder terapêutico ou espiritual demonstrado; você não precisa comprá-las para fazer as práticas.')}
 <div class="grid grid-cols-4 gap-3 mb-5">${STONES.map((x,i)=>`<button onclick="selectedStone=${i};render()" class="p-2 rounded-xl flex justify-center items-center flex-col ${selectedStone===i?'bg-[#D4AF37]/15 border border-[#D4AF37]/50':'border border-transparent'}" title="${x.name}"><div class="stone" style="width:51px;height:51px;background:${x.color}"></div><div class="text-[9px] mt-2 muted">${WORDS[i].name}</div></button>`).join('')}</div>
 ${card(`<div class="mx-auto stone" style="width:120px;height:120px;background:${s.color}"></div><div class="text-center mt-5"><div class="smallcaps text-[#D4AF37]">Pedra ${selectedStone+1} de 7</div><h2 class="serif text-2xl text-[#F3E5AB] mt-2">${s.name}</h2><p class="text-xs muted mt-2">${s.quality}</p></div><div class="border-t border-[#D4AF37]/20 mt-5 pt-4 text-xs leading-6"><p><b class="text-[#E8CC7E]">Palavra correspondente:</b> #${selectedStone+1} ${WORDS[selectedStone].name} · ${WORDS[selectedStone].he}</p><p class="mt-3"><b class="text-[#E8CC7E]">Cuidado e intenção simbólica:</b> ${s.care}</p><p class="mt-3"><b class="text-[#E8CC7E]">Declaração:</b> “${WORDS[selectedStone].decree}”</p></div><button onclick="openStoneWord()" class="ghost-button w-full rounded-xl py-3 mt-5">Explorar a palavra associada</button>`, 'mb-4')}`}
function openStoneWord(){openWord=selectedStone+1;go('words')}
function customPage(){return `${title('Bônus quinto','Meu Ritual Personalizado','Responda a três perguntas. O gerador combina suas escolhas com declarações de reflexão, sem prever ou garantir acontecimentos.')}
 ${card(`<label class="block text-xs text-[#F2DFA7] font-bold mb-2">1. Qual seu maior desafio hoje?</label><select id="customChallenge" class="field mb-4"><option value="financeiro">Organizar minha vida financeira</option><option value="saude">Cuidar da saúde e das emoções</option><option value="relacoes">Restabelecer a paz nos relacionamentos</option><option value="direcao">Encontrar clareza e direção</option><option value="bloqueio">Superar um bloqueio ou recomeçar</option></select><label class="block text-xs text-[#F2DFA7] font-bold mb-2">2. Qual sentimento predomina agora?</label><select id="customFeeling" class="field mb-4"><option value="medo">Medo ou insegurança</option><option value="cansaco">Cansaço</option><option value="esperanca">Esperança</option><option value="ansiedade">Inquietação</option><option value="gratidao">Gratidão</option></select><label class="block text-xs text-[#F2DFA7] font-bold mb-2">3. Qual bênção você deseja cultivar nos próximos 7 dias?</label><textarea id="customBlessing" class="field min-h-[90px]" maxlength="250" placeholder="Ex.: serenidade para tomar uma decisão e coragem para buscar novas oportunidades"></textarea><button onclick="generateDecree()" class="gold-button w-full rounded-xl py-3 mt-4">${icon('sparkles','w-4 h-4 inline mr-2')} Gerar meu decreto</button>`, 'mb-4')}
 <div id="generatedDecree"></div>${state.decrees.length?`${sectionLabel('Declarações guardadas')}<div class="space-y-2">${state.decrees.slice().reverse().map((d,i)=>card(`<div class="text-[10px] text-[#D8BF78]">${escapeHTML(d.date)}</div><p class="text-xs leading-6 muted mt-2 whitespace-pre-line">${escapeHTML(d.text)}</p><button onclick="copySavedDecree(${state.decrees.length-1-i})" class="text-[#E6D094] text-xs mt-3">Copiar declaração</button>`)).join('')}</div>`:''}`}
function generateDecree(){const c=document.getElementById('customChallenge').value,f=document.getElementById('customFeeling').value,wish=document.getElementById('customBlessing').value.trim();if(!wish){notify('Escreva a bênção ou intenção que você deseja cultivar.');return}const idx={financeiro:7,saude:3,relacoes:6,direcao:5,bloqueio:4}[c],secondary={medo:2,cansaco:3,esperanca:1,ansiedade:5,gratidao:7}[f],first=WORDS[idx-1],second=WORDS[secondary-1];const message=`Declaração pessoal de ${state.name}\n\nHoje escolho caminhar com sabedoria e coragem. Acolho ${first.name} (${first.he}), lembrança de ${first.theme.toLowerCase()}, e ${second.name} (${second.he}), convite à reflexão e à perseverança.\n\nDeclaro minha intenção para os próximos sete dias: ${wish}. Que eu tenha clareza para reconhecer o que posso transformar, paciência diante do que ainda não depende de mim e disposição para agir com honestidade e cuidado.\n\nAgradeço pelos recursos que já tenho, pelas pessoas que me ajudam e pelos passos que ainda posso construir. Minha fé inspira minhas escolhas, e meus atos dão forma ao meu compromisso. Assim seja.`;window.latestDecree=message;document.getElementById('generatedDecree').innerHTML=card(`<div class="smallcaps text-[#D4AF37]">Declaração personalizada</div><p class="text-xs leading-6 whitespace-pre-line mt-3 text-[#F0E4C9]">${escapeHTML(message)}</p><div class="flex gap-2 mt-5"><button onclick="copyLatestDecree()" class="ghost-button rounded-xl py-3 flex-1 flex items-center justify-center gap-2 text-xs">${icon('copy','w-4 h-4')} Copiar</button><button onclick="saveLatestDecree()" class="gold-button rounded-xl py-3 flex-1 flex items-center justify-center gap-2 text-xs">${icon('bookmark','w-4 h-4')} Favoritar</button></div>`, 'mb-5');hydrateIcons();notify('Sua declaração está pronta.')}
async function copyText(str){try{await navigator.clipboard.writeText(str);notify('Texto copiado.')}catch{const ta=document.createElement('textarea');ta.value=str;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');notify('Texto copiado.')}catch{notify('Selecione e copie o texto manualmente.')}ta.remove()}}
function copySavedDecree(index){if(state.decrees[index])copyText(state.decrees[index].text)}
function copyLatestDecree(){if(window.latestDecree)copyText(window.latestDecree)}
function saveLatestDecree(){if(!window.latestDecree)return;if(state.decrees.some(d=>d.text===window.latestDecree)){notify('Esta declaração já está nos favoritos.');return}state.decrees.push({date:new Date().toLocaleDateString('pt-BR'),text:window.latestDecree});save();notify('Declaração salva nos favoritos.');render()}
const BADGES=[{id:'first',name:'Primeiro Ritual',ic:'moon-star',desc:'Concluir o primeiro ritual',test:()=>dayCount()>=1},{id:'angel',name:'Escudo Arcangélico',ic:'shield-check',desc:'Registrar um selo de arcanjo',test:()=>Object.keys(state.shieldDates).length>0},{id:'streak7',name:'Chama de 7 Dias',ic:'flame',desc:'Sete dias consecutivos',test:()=>streak()>=7},{id:'blessing',name:'Caderno Iniciado',ic:'book-heart',desc:'Escrever a primeira bênção',test:()=>state.blessings.length>0},{id:'days21',name:'Mestre do Santuário',ic:'crown',desc:'Completar 21 dias',test:()=>dayCount()>=21}];
function profilePage(){return `${title('Sabedoria para o caminho','Mentor & Perfil','Uma orientação inspirada no manual para ligar suas reflexões a atitudes práticas.')}
 ${card(`<div class="flex items-center gap-3"><div class="w-16 h-16 rounded-full orb flex items-center justify-center">${icon('crown','w-8 h-8 text-[#291c0e]')}</div><div><div class="smallcaps text-[#D4AF37]">Sua jornada</div><h2 class="serif text-lg text-[#F2DF9E]">${escapeHTML(state.name)}</h2><p class="text-xs muted mt-1">${level()}</p></div></div><div class="grid grid-cols-3 gap-2 mt-5 text-center"><div><div class="font-bold text-lg">${state.xp}</div><span class="text-[10px] muted">XP total</span></div><div><div class="font-bold text-lg">${dayCount()}</div><span class="text-[10px] muted">Dias feitos</span></div><div><div class="font-bold text-lg">${streak()}</div><span class="text-[10px] muted">Streak 🔥</span></div></div>`, 'mb-5')}
 ${sectionLabel('Orientador espiritual')}${card(`<p class="text-xs muted leading-5 mb-4">Qual área da sua vida precisa de atenção hoje?</p><div class="space-y-2">${GUIDANCE.map(x=>`<button class="w-full rounded-xl border border-[#D4AF37]/25 p-3 text-left text-xs flex items-center gap-3 hover:bg-[#D4AF37]/10" onclick="guide('${x.key}')">${icon(x.icon,'w-5 h-5 text-[#E4C36F]')}<span class="flex-1">${x.label}</span>${icon('arrow-right','w-4 h-4 text-[#D4AF37]')}</button>`).join('')}</div>${mentorResult?mentorHTML():''}`, 'mb-5')}
 ${sectionLabel('Suas conquistas')}${card(`<div class="grid grid-cols-3 gap-4">${BADGES.map(b=>{const on=b.test();return `<div class="text-center ${on?'':'opacity-40'}"><div class="w-14 h-14 rounded-full mx-auto flex items-center justify-center ${on?'orb':'bg-[#343341] border border-[#D4AF37]/20'}">${icon(b.ic,`w-7 h-7 ${on?'text-[#281b08]':'text-[#A5A2AC]'}`)}</div><div class="text-[10px] font-bold mt-2 text-[#F0DDA2]">${b.name}</div><div class="text-[9px] muted mt-1 leading-4">${b.desc}</div></div>`}).join('')}</div>`, 'mb-5')}
 ${sectionLabel('Diário de Sinais e Bênçãos')}${card(`<p class="text-xs muted leading-6 mb-4">Registre momentos significativos, respostas que você percebeu, sonhos, coincidências ou motivos de gratidão. Os registros são relatos pessoais, não provas de causalidade.</p><textarea id="blessingText" maxlength="2000" class="field min-h-[115px]" placeholder="Hoje quero registrar..."></textarea><button onclick="saveBlessing()" class="gold-button rounded-xl w-full py-3 mt-3">Guardar no meu caderno</button>`, 'mb-3')}
 ${state.blessings.length?`<div class="space-y-2 mb-5">${state.blessings.slice().reverse().map((b,i)=>card(`<div class="flex items-center justify-between"><span class="smallcaps text-[#D4AF37]">${escapeHTML(b.date)}</span><button class="text-[10px] text-[#C8AA7A]" onclick="deleteBlessing(${state.blessings.length-1-i})">Excluir</button></div><p class="text-xs muted whitespace-pre-line leading-6 mt-3">${escapeHTML(b.text)}</p>`)).join('')}</div>`:''}
 ${sectionLabel('Configurações')}${card(`<div class="flex justify-between items-center gap-3"><div><div class="text-xs font-bold">Seus dados ficam neste dispositivo</div><p class="muted text-[10px] leading-5 mt-1">Limpar dados do navegador pode apagar o histórico. Não há sincronização entre aparelhos.</p></div>${icon('hard-drive','w-6 h-6 text-[#D4AF37] shrink-0')}</div><button onclick="confirmReset()" class="text-[11px] text-[#D1AB81] border border-[#8E5B4A]/40 rounded-lg px-3 py-2 mt-4">Resetar Progresso</button>`)}`}
function guide(key){mentorResult=GUIDANCE.find(g=>g.key===key);render();setTimeout(()=>document.getElementById('mentorResponse')?.scrollIntoView({behavior:'smooth',block:'nearest'}),50)}
function mentorHTML(){const g=mentorResult,w=WORDS[g.word-1];return `<div id="mentorResponse" class="mt-4 rounded-xl p-4 border border-[#D4AF37]/40 bg-[#D4AF37]/10"><div class="smallcaps text-[#D4AF37]">Sua orientação de hoje</div><h3 class="serif text-[17px] text-[#F4DEA0] mt-2">Palavra #${g.word}: ${w.name}</h3><div class="text-xs text-[#C4B69E] mt-2">Horário sugerido: ${String(g.time).padStart(2,'0')}:00 · flexível</div><ol class="mt-4 space-y-3">${g.steps.map((s,i)=>`<li class="text-xs leading-6 muted"><span class="text-[#E2C47A] font-bold mr-2">${i+1}.</span>${s}</li>`).join('')}</ol><p class="text-[10px] muted mt-3 border-t border-[#D4AF37]/20 pt-3">${g.note}</p><button class="ghost-button w-full rounded-xl py-3 mt-4" onclick="openGuidedWord(${g.word})">Ler a Palavra ${w.name}</button></div>`}
function openGuidedWord(n){openWord=n;go('words')}
function saveBlessing(){const e=document.getElementById('blessingText'),v=e?.value.trim();if(!v){notify('Escreva algo antes de guardar.');return}state.blessings.push({date:new Date().toLocaleString('pt-BR'),text:v});state.xp+=10;save();notify('Registro salvo com carinho. +10 XP');render()}
function deleteBlessing(i){if(!confirm('Excluir este registro do seu caderno?'))return;state.blessings.splice(i,1);save();render()}
function confirmReset(){showModal(`<div class="text-center"><div class="text-[#C4A15E] flex justify-center mb-4">${icon('alert-triangle','w-10 h-10')}</div><h2 class="serif text-xl text-[#EAD28A]">Resetar seu progresso?</h2><p class="text-xs muted leading-6 mt-3">Esta ação apaga nome, XP, rituais, diário, declarações e registros salvos neste navegador. Ela não pode ser desfeita.</p><div class="grid grid-cols-2 gap-2 mt-6"><button class="ghost-button rounded-xl py-3" onclick="closeModal()">Cancelar</button><button class="rounded-xl py-3 bg-[#8C4339] text-white font-bold" onclick="resetAll()">Sim, apagar tudo</button></div></div>`)}
function resetAll(){pauseRitual();stopSound();closeImmersive();localStorage.removeItem(KEY);state=defaultState();ritual.remaining=180;ritualFocus='geral';selectedDay=1;mentorResult=null;activeBonus=null;tab='home';closeModal();render()}
function showModal(content){document.getElementById('modalRoot').innerHTML=`<div class="modal-scrim"><div class="modal-panel glass rounded-[24px] p-6">${content}</div></div>`;hydrateIcons()}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function showOnboarding(){if(document.getElementById('onboarding'))return;document.getElementById('modalRoot').innerHTML=`<div class="modal-scrim" id="onboarding"><div class="modal-panel rounded-[28px] p-7 text-center border border-[#D4AF37]/35 bg-[radial-gradient(ellipse_at_50%_10%,#2c2840,#11131F_70%)]"><div class="smallcaps text-[#D5B86B]">Uma nova jornada começa</div><div class="hero-orbit w-44 h-44 mx-auto my-8 flex items-center justify-center"><div class="w-28 h-28 orb rounded-full flex items-center justify-center">${icon('key-round','w-12 h-12 text-[#281b08]')}</div></div><h1 class="serif gold-text text-[27px] leading-10">Você foi chamado<br>ao Santuário</h1><p class="text-sm muted leading-7 mt-4">Uma jornada de 21 dias para cultivar sabedoria, presença e gratidão. Como devemos te chamar?</p><form id="onboardingForm" class="mt-7"><label for="onboardName" class="sr-only">Seu nome</label><input class="field text-center" id="onboardName" maxlength="45" required placeholder="Digite seu primeiro nome" autocomplete="given-name"><button class="gold-button w-full rounded-xl py-4 mt-3" type="submit">Entrar no meu Santuário ${icon('arrow-right','w-4 h-4 inline-block ml-2')}</button></form><p class="text-[10px] muted mt-5 leading-5">Sua jornada fica salva apenas neste navegador.</p></div></div>`;const onboardingForm=document.getElementById('onboardingForm');if(onboardingForm)onboardingForm.addEventListener('submit',finishOnboarding);hydrateIcons()}
function finishOnboarding(event){if(event)event.preventDefault();const input=document.getElementById('onboardName');const v=(input?.value||'').trim().replace(/\s+/g,' ');if(v.length<2){notify('Digite um nome com pelo menos duas letras.');input?.focus();return false}state.name=v;state.onboardedAt=new Date().toISOString();save();const modal=document.getElementById('onboarding');if(modal)modal.remove();closeModal();try{render()}catch(error){console.error('Erro ao atualizar painel:',error);document.getElementById('topbar').innerHTML=header();document.getElementById('main').innerHTML='<section class="page"><h1 class="serif gold-text text-xl">Bem-vindo ao Santuário</h1><p class="mt-4">Seu nome foi salvo. Atualize a página para continuar.</p></section>'}notify(`Boas-vindas ao Santuário, ${v}!`);return false}
// Mantém o timer alinhado ao relógio real mesmo se a aba ficar em segundo plano.
document.addEventListener('visibilitychange',()=>{if(ritual.running)tickRitual()});
window.addEventListener('beforeunload',()=>{if(ritual.interval)clearInterval(ritual.interval)});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&ritual.fullscreen)closeImmersive()});
window.addEventListener('load',()=>{render();setTimeout(hydrateIcons,700)});
</script>
</body>
</html>
